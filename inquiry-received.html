<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>咨询提交结果 | 芯聚电子 SIMACITY</title>
<link rel="stylesheet" href="styles.css">
<style>body{background:#f5f5f5}.receipt{max-width:680px;margin:12vh auto;padding:48px;background:white;border-top:4px solid #c50035}.receipt h1{font-size:32px}.receipt p{color:#666}.receipt-links{display:flex;gap:20px;flex-wrap:wrap;margin-top:28px}@media(max-width:700px){.receipt{margin:8vh 20px;padding:30px}.receipt h1{font-size:26px}}</style>
</head>
<body><main class="receipt"><div class="eyebrow dark">SIMACITY / 芯聚电子</div><h1>感谢您的咨询</h1><p>芯聚电子将根据您填写的联系方式处理本次需求。如需进一步沟通，请致电 021-62271972，或发送邮件至 sales@simacity.com.cn。</p><div class="receipt-links"><a class="button" href="index.html#contact">返回联系我们 ↗</a><a class="button" href="/downloads/">查看资料下载 ↓</a></div></main>
<script>try{if(localStorage.getItem('simacity-language')==='en'){document.documentElement.lang='en';document.title='Inquiry | SIMACITY';document.querySelector('h1').textContent='Thank you for your inquiry';document.querySelector('.receipt p').textContent='SIMACITY will use your contact details to respond. For further assistance, call +86 21 6227 1972 or email sales@simacity.com.cn.';const links=document.querySelectorAll('.receipt-links a');links[0].textContent='Back to contact ↗';links[1].textContent='Browse datasheets ↓';links[1].href='/en/downloads/';}}catch{}</script>
</body></html>
