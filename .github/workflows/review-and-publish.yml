name: Review and publish website
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false
jobs:
  review:
    name: Editorial review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test review gates
        run: python -m unittest discover -s tests -v
      - name: Validate reviewed entries and build
        env:
          SIMACITY_ENABLE_NETLIFY_FORMS: '1'
          SITE_URL: ${{ vars.SITE_URL }}
        run: python scripts/build_site.py --strict
      - name: Check static detail pages and SEO
        run: python scripts/check_static_seo.py
      - uses: actions/upload-artifact@v4
        with:
          name: website
          path: dist/
          retention-days: 14
      - name: Deploy approved website to Netlify
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo '::notice::Website artifact is ready. Netlify deployment is not enabled: configure NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID repository secrets.'
            exit 0
          fi
          python scripts/deploy_netlify.py
